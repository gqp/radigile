; Reference PHP-FPM hardening overrides for the production Droplet.
; Drop into a conf.d include, e.g. /etc/php/8.2/fpm/conf.d/99-radigile-hardening.ini
; then `systemctl restart php8.2-fpm`. Adjust the PHP version path to match
; what's actually installed.

; Don't advertise the PHP version in the X-Powered-By response header.
expose_php = Off

; Keep error detail out of rendered responses in production — Laravel's own
; APP_DEBUG=false already prevents Laravel-level stack traces, this is the
; PHP-level equivalent for errors PHP itself raises before Laravel boots.
display_errors = Off
display_startup_errors = Off
log_errors = On

; Disable functions this app has no legitimate use for. Trim this list only
; if something in the app or its dependencies genuinely needs one of these.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

; Reasonable upload/body limits — the app's own client_max_body_size in
; nginx should match or stay below these.
upload_max_filesize = 20M
post_max_size = 20M

; Session cookies: belt-and-suspenders alongside Laravel's own
; SESSION_SECURE_COOKIE/http_only config — these are the PHP-native
; equivalents in case anything ever touches native PHP sessions directly.
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
