; Reference PHP-FPM performance overrides for the production Droplet.
; Drop into a conf.d include, e.g. /etc/php/8.2/fpm/conf.d/98-radigile-performance.ini
; (loads before 99-radigile-hardening.ini, order doesn't matter here since
; there's no overlap) then `systemctl restart php8.2-fpm`.

; OPcache — without this, PHP recompiles every file (Laravel framework +
; vendor + app code) from scratch on every single request. This is typically
; the single biggest PHP-level performance lever available.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000

; validate_timestamps=0 means PHP stops checking whether source files changed
; and just serves the compiled version forever — much faster, but it also
; means a deploy WILL NOT take effect until you reload PHP-FPM
; (`systemctl reload php8.2-fpm`, already part of deploy.sh's restart step
; indirectly via the queue restart — add an explicit FPM reload too). If
; you'd rather not depend on remembering that, set this to 1 with a low
; opcache.revalidate_freq instead — slightly slower, self-healing.
opcache.validate_timestamps = 0
; opcache.revalidate_freq = 0   ; only relevant if validate_timestamps=1
