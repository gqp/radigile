# Reference nginx server block for the Radagile Laravel app on a
# self-managed DigitalOcean Droplet. This is a starting point to review
# and adapt to your actual paths/domain/PHP-FPM socket — it has not been
# tested against the real production box.
#
# Replace radagile.com and the fastcgi_pass socket path before using.

server {
    listen 80;
    listen [::]:80;
    server_name radagile.com www.radagile.com;

    # Redirect all plain HTTP to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name radagile.com www.radagile.com;

    # Managed via certbot/Let's Encrypt or your own certs.
    ssl_certificate     /etc/letsencrypt/live/radagile.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radagile.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Laravel's public/ directory is the only thing that should ever be
    # served directly — never point document root at the repo root.
    root /var/www/radagile/public;
    index index.php;

    charset utf-8;

    # Compress text-based responses — HTML, the compiled CSS/JS bundles, JSON
    # API responses. Images/fonts are already compressed formats, skip those.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # The app already sets CSP/X-Frame-Options/etc. via SecurityHeaders
    # middleware for PHP responses. These cover static assets and any
    # response nginx serves directly (error pages) that never reach PHP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Block access to .env, .git, storage internals, and any dotfile —
    # nginx should never serve these even if a misconfiguration exposes them.
    location ~ /\.(?!well-known).* {
        deny all;
    }
    location ~ ^/(\.env|\.git|storage/(app|framework|logs)|bootstrap/cache) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Static assets: cache aggressively, no need to hit PHP-FPM for these.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|webp|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 20m;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Adjust to your actual PHP-FPM pool socket/version.
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.ht {
        deny all;
    }

    access_log /var/log/nginx/radagile-access.log;
    error_log  /var/log/nginx/radagile-error.log;
}
